name: Check and build Android app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run audit:recommendations
      - run: npm run audit:learning
      - run: npm run audit:stories
      - run: npm test
      - run: npm run check:browser
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-reports
          path: browser-reports/
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/test-results/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: friends-to-amigos-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
